plugins {
    id 'java'
    id 'kotlin'
    id 'org.jetbrains.intellij.platform'
}

group = rootProject.group
version = rootProject.version

def refactoringMinerVersion = project.findProperty('refactoringMinerVersion') ?: '3.1.2'

dependencies {
    implementation(project(":common"))
    implementation(project(":java-impl"))
    implementation("com.github.tsantalis:refactoring-miner:${refactoringMinerVersion}") {
        exclude group: "org.slf4j", module: "slf4j-log4j12"
    }
    implementation("org.slf4j:slf4j-jdk14:2.0.17")
    testImplementation('junit:junit:4.13.2')
    testImplementation 'org.mockito:mockito-core:5.23.0'

    // JGit is runtime-scoped in RefactoringMiner's POM — needed on compile classpath
    // for any plugin source that references org.eclipse.jgit.lib.Repository directly.
    compileOnly 'org.eclipse.jgit:org.eclipse.jgit:6.10.1.202505221210-r'

    intellijPlatform {
        intellijIdea("2026.1")
        bundledPlugin("com.intellij.java")
        bundledPlugin("Git4Idea")
        bundledPlugin("org.jetbrains.plugins.github")
        bundledPlugin("org.jetbrains.kotlin")
        pluginVerifier()
        zipSigner()
    }
}

tasks.named('runIde').configure {
    maxHeapSize = "4g"
}

intellijPlatform {
    pluginConfiguration {
        version = providers.provider { project.version.toString() }
        ideaVersion {
            sinceBuild = "261"
        }
    }
    pluginVerification {
        ides {
            recommended()
        }
    }
}
